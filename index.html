<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AVS Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f8fafc;
    color: #1e293b;
    padding: 24px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #047857;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 20px;
  }
  .form-row {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  label {
    font-size: 12px;
    font-weight: 600;
    color: #475569;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  input[type="text"] {
    padding: 8px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: #059669;
    box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.15);
  }
  textarea {
    width: 100%;
    height: 380px;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-family: 'SF Mono', 'Menlo', monospace;
    font-size: 12px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
  }
  textarea:focus {
    border-color: #059669;
    box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.15);
  }
  .hint {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 4px;
  }
  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  button {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #059669, #047857);
    color: #fff;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled {
    background: #94a3b8;
    cursor: not-allowed;
  }
  .btn-secondary {
    background: #e2e8f0;
    color: #475569;
  }
  .btn-secondary:hover { background: #cbd5e1; }
  .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
  #status {
    margin-top: 12px;
    font-size: 13px;
    min-height: 20px;
  }
  .status-success { color: #059669; font-weight: 600; }
  .status-error { color: #dc2626; font-weight: 600; }
  .status-working { color: #2563eb; }
</style>
</head>
<body>

<h1>After Visit Summary Generator</h1>
<div class="subtitle">Women's Specialists of Clear Lake &mdash; Weight Management Program</div>

<div class="form-row">
  <div class="form-group">
    <label for="patientName">Patient Name</label>
    <input type="text" id="patientName" placeholder="Jane Doe">
  </div>
</div>

<label for="rawText">Paste Patient Letter + Measurements</label>
<textarea id="rawText" placeholder="Paste the full patient letter here...

Then paste measurement lines at the bottom:
Date: 8/19/2025 | Weight: 237.1 lbs | Waist: 40 in | Neck: 16 in | Hip: 49 in | BMI: 36.85
Date: 9/16/2025 | Weight: 228.5 lbs | Waist: 37.5 in | Neck: 15 in | Hip: 47.5 in | BMI: 35.51"></textarea>
<div class="hint">Letter text above, pipe-delimited measurement lines at the bottom. They'll be auto-detected.</div>

<div class="btn-row">
  <button class="btn-primary" id="btnGenerate">Generate PDF</button>
  <button class="btn-secondary" id="btnPrint" disabled>Print</button>
  <button class="btn-secondary" id="btnOpen" disabled>Open PDF</button>
</div>

<div id="status"></div>

<script src="generator.js"></script>
<script src="renderer.js"></script>
</body>
</html>
